spring.application.name=NetraceBackend

# Max time to establish a TCP connection to the target URL.
netrace.analyzer.connect-timeout=5s
# Max time for the whole request/response exchange once connected,
# including downloading the full response body.
netrace.analyzer.request-timeout=10s
# Max response body size read before the download is abandoned. A
# server can otherwise send an arbitrarily large or unbounded (e.g.
# never-ending chunked) body, wasting bandwidth/CPU even though the
# bytes are discarded either way.
netrace.analyzer.max-response-size=10MB
